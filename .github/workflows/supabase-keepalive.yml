name: Supabase Keep-Alive

# Pinga Supabase REST API svaki dan da se baza ne pauzira na free planu
# (Supabase pauzira projekte posle 7 dana slabe aktivnosti).
# GitHub Actions cron koristi UTC vreme i zakazana pokretanja često kasne.
# Napomena: u javnom repou GitHub sam isključi zakazane workflow-e posle
# 60 dana bez commita - tada ga treba ponovo uključiti u Actions tabu.
on:
  schedule:
    - cron: "0 8 * * *"     # Svaki dan u 08:00 UTC (09:00 ili 10:00 po našem vremenu)
  workflow_dispatch:         # Može se pokrenuti ručno iz GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/salon_holidays?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          echo "Supabase ping status: $STATUS"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "::error::Supabase ping failed with HTTP $STATUS"
            exit 1
          fi

          echo "✅ Supabase je aktivan."
