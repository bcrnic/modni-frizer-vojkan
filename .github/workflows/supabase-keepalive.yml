name: Supabase Keep-Alive

# Pinga Supabase REST API svaka 4 dana da baza ne pauze na free planu.
# GitHub Actions cron koristi UTC vreme.
on:
  schedule:
    - cron: "0 8 */4 * *"   # Svaka 4 dana u 08:00 UTC (09:00 ili 10:00 CET)
  workflow_dispatch:         # Može se pokrenuti ručno iz GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")

          echo "Supabase ping status: $STATUS"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "::error::Supabase ping failed with HTTP $STATUS"
            exit 1
          fi

          echo "✅ Supabase je aktivan."
