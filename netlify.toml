[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # The site is served from the domain root on Netlify (GitHub Pages uses /modni-frizer-vojkan/)
  BASE_PATH = "/"

# The public pages are static. Only the admin route needs the React entry point.
# Netlify serves 404.html with HTTP 404 for paths that do not match a file.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# Keep the admin panel out of search results. Search engines must still be
# able to fetch the page to see this header, so robots.txt does not block it.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Basic security headers for every page.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Built files have a content hash in their name, so they can be cached for good.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
